      async function bootApp() {
        const blobMap = {};
        for (const mod of moduleOrder) {
          const res = await fetch(`${mod.id}?v=${Date.now()}`);
          let source = await res.text();
          source = source.replace(/import\s+['"]\.\/index\.css['"];?/g, '');
          source = source.replace(/import\.meta\.env/g, '(window.__ENV__ || {})');

          // 1. Reemplazar imports / re-exports estáticos
          for (const [alias, blobUrl] of Object.entries(blobMap)) {
            const escaped = alias.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            // Reemplaza: from './alias' o from '../alias'
            const reFrom = new RegExp(`from\\s+['"]${escaped}['"]`, 'g');
            source = source.replace(reFrom, `from '${blobUrl}'`);
            // Reemplaza: import './alias'
            const reImport = new RegExp(`import\\s+['"]${escaped}['"]`, 'g');
            source = source.replace(reImport, `import '${blobUrl}'`);
          }

          // 2. Seguridad: advertir si quedó algún import relativo no resuelto hacia un blob:
          const unhandledRelative = source.match(/(?:from|import)\s+['"](\.[^'"]+)['"]/);
          if (unhandledRelative) {
            console.error(
              `[Bootloader] Specifier relativo no resuelto en ${mod.id}: "${unhandledRelative[1]}". Esto provocaría error "base scheme isn't hierarchical".`
            );
          }

          const compiled = window.Babel.transform(source, {
            presets: ['react'],
            filename: mod.id,
          }).code;

          const url = URL.createObjectURL(
            new Blob([compiled], { type: 'application/javascript' })
          );
          for (const alias of mod.aliases) {
            blobMap[alias] = url;
          }
          if (mod.id === '/src/main.jsx') {
            await import(url);
          }
        }
      }

      bootApp().catch((err) => {
        console.error('Error iniciando aplicación:', err);
        document.getElementById('root').innerHTML = `
          <div style="padding:24px;color:#991b1b;background:#fef2f2;font-family:sans-serif">
            <strong>Error cargando la aplicación:</strong> ${err.message}
          </div>
        `;
      });
